<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoreboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
    }

    body {
      display: flex;
      /* justify-content / align-items set from state */
    }

    #offset {
      /* transform: translate(offsetX, offsetY) set from state */
    }

    #count {
      /* font-family set from state (via dynamically injected @font-face) */
      font-family: monospace;
      color: #fff;
      line-height: 1;
      white-space: nowrap;
      /* font-size and text-shadow set from state */
    }

    .digit {
      display: inline-block;
    }

    @keyframes flash-pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    #count.flash {
      animation: flash-pulse 200ms ease-out;
    }

    @keyframes digit-pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .digit.pulse {
      animation: digit-pulse 200ms ease-out;
    }

    /* Crossfade: outgoing fades out, incoming fades in. */
    @keyframes fade-out {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .digit-out {
      animation: fade-out 200ms ease-out forwards;
    }
    .digit-fade-in {
      animation: fade-in 200ms ease-out forwards;
    }

    /* Slide: digits slide in/out vertically, clipped by overflow. */
    @keyframes slide-up-in {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    @keyframes slide-up-out {
      from { transform: translateY(0); }
      to   { transform: translateY(-100%); }
    }
    @keyframes slide-down-in {
      from { transform: translateY(-100%); }
      to   { transform: translateY(0); }
    }
    @keyframes slide-down-out {
      from { transform: translateY(0); }
      to   { transform: translateY(100%); }
    }
    .slide-in[data-dir="up"]   { animation: slide-up-in 250ms ease-out; }
    .slide-out[data-dir="up"]  { animation: slide-up-out 250ms ease-out forwards; }
    .slide-in[data-dir="down"] { animation: slide-down-in 250ms ease-out; }
    .slide-out[data-dir="down"]{ animation: slide-down-out 250ms ease-out forwards; }

    /* Milestone flash: invert the full viewport. The class goes on <body>
       so the white fills the whole screen rather than the count's box.
       Glow (text-shadow) layers on top and stays visible. */
    body.inverted {
      background: #fff;
    }
    body.inverted #count {
      color: #000;
    }
  </style>
</head>
<body>
  <div id="offset"><div id="count">0</div></div>

  <script src="/display.js"></script>
  <script>
    const renderer = ScoreboardRenderer.createRenderer({
      document,
      body: document.body,
      offsetEl: document.getElementById('offset'),
      countEl: document.getElementById('count'),
    });

    let ws = null;
    function connect() {
      ws = new WebSocket(`ws://${location.host}`);
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'state') renderer.applyState(msg.state);
        } catch {}
      };
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = () => { try { ws.close(); } catch {} };
    }
    connect();
  </script>
</body>
</html>
