<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoreboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: none;
    }

    body {
      display: flex;
      /* justify-content / align-items set from state */
      /* background: set inline from state.bgColor */
      background: #000;
    }

    #offset {
      /* transform: translate(offsetX, offsetY) set from state */
    }

    #count {
      /* font-family set from state (via dynamically injected @font-face) */
      font-family: monospace;
      color: #fff;
      line-height: 1;
      white-space: nowrap;
      /* font-size and text-shadow set from state */
    }

    .digit {
      display: inline-block;
      vertical-align: top;
    }

    @keyframes flash-pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    #count.flash {
      animation: flash-pulse 200ms ease-out;
    }

    @keyframes digit-pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .digit.pulse {
      animation: digit-pulse 200ms ease-out;
    }

    /* Crossfade: outgoing fades out, incoming fades in. */
    @keyframes fade-out {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .digit-out {
      animation: fade-out 200ms ease-out forwards;
    }
    .digit-fade-in {
      animation: fade-in 200ms ease-out forwards;
    }

    /* Slide: digits slide in/out vertically with opacity, clipped by overflow. */
    @keyframes slide-up-in {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes slide-up-out {
      from { transform: translateY(0);    opacity: 1; }
      to   { transform: translateY(-100%); opacity: 0; }
    }
    @keyframes slide-down-in {
      from { transform: translateY(-100%); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }
    @keyframes slide-down-out {
      from { transform: translateY(0);    opacity: 1; }
      to   { transform: translateY(100%); opacity: 0; }
    }
    .slide-in[data-dir="up"]   { animation: slide-up-in 125ms ease-out; }
    .slide-out[data-dir="up"]  { animation: slide-up-out 125ms ease-out forwards; }
    .slide-in[data-dir="down"] { animation: slide-down-in 125ms ease-out; }
    .slide-out[data-dir="down"]{ animation: slide-down-out 125ms ease-out forwards; }

    /* Milestone flash: invert the full viewport.  Colors swap via the
       --bg-color / --text-color custom properties set from state, so the
       inversion respects the user's configured background and text colors
       rather than hard-coding black/white.  !important is required to
       beat the inline body background / count color set by applyState. */
    body.inverted {
      background: var(--text-color, #fff) !important;
    }
    body.inverted #count,
    body.inverted #supertext {
      color: var(--bg-color, #000) !important;
    }
  </style>
</head>
<body>
  <div id="offset"><div id="count">0</div></div>

  <script src="/display.js"></script>
  <script>
    const renderer = ScoreboardRenderer.createRenderer({
      document,
      body: document.body,
      offsetEl: document.getElementById('offset'),
      countEl: document.getElementById('count'),
    });

    let ws = null;
    let bootDone = false;
    let pendingState = null;
    let versionText = null;

    function applyVersionStyle(state) {
      // Version text shares the count's visual slot (same font, alignment,
      // Y offset) but renders at 40% of fontSize in white so it reads as
      // status text.  Before state arrives, default to jd_led5 at 120px.
      const el = document.getElementById('count');
      document.body.style.justifyContent = 'center';
      if (state) {
        const V = { top: 'flex-start', center: 'center', bottom: 'flex-end' };
        document.body.style.alignItems = V[state.alignV] || 'center';
        document.getElementById('offset').style.transform =
          'translate(0px, ' + (state.offsetY || 0) + 'px)';
        el.style.fontSize = Math.round((state.fontSize || 400) * 0.4) + 'px';
        el.style.color = '#ffffff';
        renderer.applyFont(state.selectedFont || 'jd_led5');
      } else {
        document.body.style.alignItems = 'center';
        document.getElementById('offset').style.transform = 'translate(0px, 0px)';
        el.style.fontSize = '120px';
        el.style.color = '#ffffff';
        renderer.applyFont('jd_led5');
      }
    }

    function connect() {
      ws = new WebSocket(`ws://${location.host}`);
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'state') {
            if (!bootDone) {
              pendingState = msg.state;
              // Update version display to match scoreboard positioning.
              if (versionText) applyVersionStyle(msg.state);
            } else {
              renderer.applyState(msg.state, { lastAction: msg.lastAction });
            }
          }
        } catch {}
      };
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = () => { try { ws.close(); } catch {} };
    }

    function finishBoot() {
      bootDone = true;
      versionText = null;
      if (pendingState) renderer.applyState(pendingState);
    }

    // Show commit hash briefly on initial load.
    fetch('/version')
      .then(r => r.json())
      .then(data => {
        versionText = data.commit || 'dev';
        const el = document.getElementById('count');
        el.textContent = versionText;
        applyVersionStyle(pendingState);
        setTimeout(finishBoot, 3000);
      })
      .catch(() => {
        // Can't get version — skip straight to scoreboard.
        finishBoot();
      });

    connect();
  </script>
</body>
</html>
