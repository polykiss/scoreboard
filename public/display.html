<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoreboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
    }

    body {
      display: flex;
      /* justify-content / align-items set from state */
    }

    #offset {
      /* transform: translate(offsetX, offsetY) set from state */
    }

    #count {
      /* font-family set from state (via dynamically injected @font-face) */
      font-family: monospace;
      color: #fff;
      line-height: 1;
      white-space: nowrap;
      /* font-size and text-shadow set from state */
    }

    @keyframes flash-pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    #count.flash {
      animation: flash-pulse 200ms ease-out;
    }

    /* Milestone flash: swap foreground/background. Glow (text-shadow)
       layers on top and stays visible. */
    #count.inverted {
      color: #000;
      background-color: #fff;
    }
  </style>
</head>
<body>
  <div id="offset"><div id="count">0</div></div>

  <script src="/display.js"></script>
  <script>
    const renderer = ScoreboardRenderer.createRenderer({
      document,
      body: document.body,
      offsetEl: document.getElementById('offset'),
      countEl: document.getElementById('count'),
    });

    let ws = null;
    function connect() {
      ws = new WebSocket(`ws://${location.host}`);
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'state') renderer.applyState(msg.state);
        } catch {}
      };
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = () => { try { ws.close(); } catch {} };
    }
    connect();
  </script>
</body>
</html>
